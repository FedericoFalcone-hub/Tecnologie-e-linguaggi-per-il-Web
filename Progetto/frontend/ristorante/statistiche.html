<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiche - Bizarre Bites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<div class="container py-5" style="max-width: 900px;">
    <a href="gestione_ristorante.html"
       class="text-decoration-none text-muted d-inline-flex align-items-center gap-1 mb-3" style="font-size: 14px;">
        ← Torna alla gestione
    </a>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h3 class="mb-0" style="font-weight: 700;">Statistiche</h3>
        <div class="d-flex align-items-center gap-2">
            <button type="button" id="anno-precedente" class="btn btn-outline-dark btn-sm rounded-circle"
                    style="width: 34px; height: 34px;" aria-label="Anno precedente">‹
            </button>
            <span id="anno" class="fw-bold fs-5 text-center" style="min-width: 60px;"></span>
            <button type="button" id="anno-successivo" class="btn btn-outline-dark btn-sm rounded-circle"
                    style="width: 34px; height: 34px;" aria-label="Anno successivo">›
            </button>
        </div>
    </div>

    <p id="nessun-dato" class="text-muted text-center d-none"></p>

    <div id="contenuto">

        <!-- Riepilogo annuale -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <small class="text-muted d-block">Ordini totali</small>
                        <span id="kpi-ordini" class="fs-4 fw-bold">0</span>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <small class="text-muted d-block">Incasso</small>
                        <span id="kpi-incasso" class="fs-4 fw-bold text-brand">€ 0.00</span>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <small class="text-muted d-block">Scontrino medio</small>
                        <span id="kpi-scontrino" class="fs-4 fw-bold">€ 0.00</span>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <small class="text-muted d-block">Tempo medio</small>
                        <span id="kpi-tempo" class="fs-4 fw-bold">—</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Riepilogo mensile -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Incasso mensile</h5>
                <div style="position: relative; height: 260px;">
                    <canvas id="grafico"></canvas>
                </div>
            </div>
        </div>

        <!-- Piatti più acquistati -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Piatti più acquistati</h5>

                <div id="modello-barra" class="d-none mb-3">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="barra-nome fw-semibold"></span>
                        <span class="barra-dettaglio text-muted"></span>
                    </div>
                    <div class="progress" style="height: 8px;">
                        <div class="barra-riempimento progress-bar" style="background-color: var(--brand);"></div>
                    </div>
                </div>

                <div id="lista-piatti"></div>
                <p id="nessun-piatto" class="text-muted mb-0 d-none">Nessun piatto venduto.</p>
            </div>
        </div>

        <!-- Dettaglio per mese -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Dettaglio per mese</h5>

                <div class="overflow-auto">
                    <div style="min-width: 480px;">
                        <div class="d-grid text-muted mb-2 pb-2 border-bottom"
                             style="grid-template-columns: 1fr 70px 90px 90px 70px; column-gap: 8px; font-size: 14px;">
                            <span>Mese</span>
                            <span class="text-end">N° Ordini</span>
                            <span class="text-end">Incasso Totale</span>
                            <span class="text-end">Scontrino Medio</span>
                            <span class="text-end">Tempo Medio</span>
                        </div>

                        <div id="modello-mese" class="d-none mb-3 pb-3 border-bottom">
                            <div class="d-grid"
                                 style="grid-template-columns: 1fr 70px 90px 90px 70px; column-gap: 8px;">
                                <span class="mese-nome fw-bold"></span>
                                <span class="mese-ordini text-end"></span>
                                <span class="mese-incasso text-end fw-semibold"></span>
                                <span class="mese-scontrino text-end"></span>
                                <span class="mese-tempo text-end text-muted"></span>
                            </div>
                            <small class="mese-piatti text-muted d-block mt-1"></small>
                        </div>

                        <div id="lista-mesi"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../../backend/lib.js"></script>

<script>
    checkLoggedRistoratore();
    const ristorante = JSON.parse(localStorage.getItem('ristorante'));
    document.title = `Statistiche - ${ristorante.nomeRistorante} | Bizarre Bites`;
    const utente = JSON.parse(localStorage.getItem('utente'));
    const annoCorrente = new Date().getFullYear();
    const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
        'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

    let anno = annoCorrente;
    let grafico = null;

    const euro = n => `€ ${Number(n).toFixed(2)}`;
    const minuti = m => m > 0 ? `${m} min` : '—';

    function renderBarre(piatti) {
        const lista = document.getElementById('lista-piatti');
        const modello = document.getElementById('modello-barra');
        lista.innerHTML = '';
        document.getElementById('nessun-piatto').classList.toggle('d-none', piatti.length > 0);

        const massimo = Math.max(...piatti.map(p => p.quantita), 1);
        piatti.forEach(p => {
            const clone = modello.cloneNode(true);
            clone.removeAttribute('id');
            clone.classList.remove('d-none');
            clone.querySelector('.barra-nome').textContent = p.nome;
            clone.querySelector('.barra-dettaglio').textContent = `${p.quantita} pz`;
            clone.querySelector('.barra-riempimento').style.width = `${(p.quantita / massimo) * 100}%`;
            lista.appendChild(clone);
        });
    }

    function renderMesi(mesi) {
        const lista = document.getElementById('lista-mesi');
        const modello = document.getElementById('modello-mese');
        lista.innerHTML = '';

        [...mesi].reverse().filter(m => m.numeroOrdini > 0).forEach(m => {
            const clone = modello.cloneNode(true);
            clone.id = m.mese;
            clone.classList.remove('d-none');
            clone.querySelector('.mese-nome').textContent = MESI[m.mese - 1];
            clone.querySelector('.mese-ordini').textContent = String(m.numeroOrdini);
            clone.querySelector('.mese-incasso').textContent = euro(m.incassoTotale);
            clone.querySelector('.mese-scontrino').textContent = euro(m.scontrinoMedio);
            clone.querySelector('.mese-tempo').textContent = minuti(m.tempoPreparazioneMedio);

            const top = m.piattiPiuAcquistati.slice(0, 3).map(p => `${p.nome} (${p.quantita})`).join(', ');
            const piatti = clone.querySelector('.mese-piatti');
            piatti.textContent = top ? `Più acquistati: ${top}` : '';
            piatti.classList.toggle('d-none', !top);
            lista.appendChild(clone);
        });
    }

    function renderGrafico(mesi) {
        const colore = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#ff7a1a';
        if (grafico) grafico.destroy();

        grafico = new Chart(document.getElementById('grafico'), {
            type: 'bar',
            data: {
                labels: MESI.map(m => m.slice(0, 3)),
                datasets: [{
                    label: 'Incasso',
                    data: mesi.map(m => m.incassoTotale),
                    backgroundColor: colore,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {display: false},
                    tooltip: {
                        callbacks: {
                            label: ctx => euro(ctx.parsed.y),
                        }
                    }
                },
                scales: {y: {beginAtZero: true}}
            }
        });
    }

    function render(dati) {
        const t = dati.totaliAnno;
        const vuoto = t.numeroOrdini === 0;

        const messaggio = document.getElementById('nessun-dato');
        messaggio.textContent = `Nessun ordine consegnato nel ${dati.anno}.`;
        messaggio.classList.toggle('d-none', !vuoto);
        document.getElementById('contenuto').classList.toggle('d-none', vuoto);
        if (vuoto) return;

        document.getElementById('kpi-ordini').textContent = String(t.numeroOrdini);
        document.getElementById('kpi-incasso').textContent = euro(t.incassoTotale);
        document.getElementById('kpi-scontrino').textContent = euro(t.scontrinoMedio);
        document.getElementById('kpi-tempo').textContent = minuti(t.tempoPreparazioneMedio);

        renderGrafico(dati.mesi);
        renderBarre(t.piattiPiuAcquistati);
        renderMesi(dati.mesi);
    }

    function aggiornaSelettore() {
        document.getElementById('anno').textContent = String(anno);
        document.getElementById('anno-successivo').disabled = anno >= annoCorrente;
    }

    async function caricaStatistiche() {
        aggiornaSelettore();
        try {
            const response = await fetch(`http://localhost:3005/user/${utente._id}/ristorante/statistiche?anno=${anno}&api_key=${API_KEY}`);
            const dati = await response.json();

            if (dati.error) {
                const messaggio = document.getElementById('nessun-dato');
                messaggio.textContent = dati.error;
                messaggio.classList.remove('d-none');
                document.getElementById('contenuto').classList.add('d-none');
                return;
            }
            render(dati);
        } catch (error) {
            console.error('Errore:', error);
        }
    }

    document.getElementById('anno-precedente').addEventListener('click', () => {
        anno--;
        caricaStatistiche();
    });

    document.getElementById('anno-successivo').addEventListener('click', () => {
        if (anno < annoCorrente) {
            anno++;
            caricaStatistiche();
        }
    });

    caricaStatistiche();
</script>
</body>
</html>

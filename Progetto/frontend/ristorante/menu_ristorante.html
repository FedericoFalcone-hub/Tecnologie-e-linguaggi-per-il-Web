<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu Ristorante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>
<body>


<div id="navbar-container"></div>

<!-- Menù vuoto -->
<div id="vuoto" class="container py-5" style="display: none;">
    <div class="text-center mb-5">
        <h2 class="text-dark mb-2" style="font-size: 32px; font-weight: 700;">Il menù è vuoto
        </h2>
        <p class="text-muted" style="font-size: 15px;">Aggiungi i piatti per comporre il menù</p>
        <button class="btn btn-brand rounded-pill px-4 " data-bs-toggle="modal" data-bs-target="#modalAggiungiPiatto">+
            Aggiungi piatto
        </button>
    </div>
</div>

<!-- Lista piatti -->
<div id="pieno" class="container py-5" style="display: none;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <a href="gestione_ristorante.html"
               class="text-decoration-none text-muted d-inline-flex align-items-center gap-1 mb-2"
               style="font-size: 14px;">← Torna alla gestione</a>
            <h2 class="text-dark mb-0" style="font-size: 28px; font-weight: 700;">Il tuo menu</h2>
        </div>
        <button class="btn btn-brand rounded-pill px-4 " data-bs-toggle="modal" data-bs-target="#modalAggiungiPiatto">+
            Aggiungi piatto
        </button>
    </div>

    <div id="body" class="row g-4">
        <div id="modello-menu" class="col-lg-4 col-md-6 d-none menu-item-card">
            <div class="card border-0 shadow-sm h-100">
                <img src="" class="card-img-top" alt="" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                        <h5 class="card-title mb-0"></h5>
                        <span class="badge-categoria categoria-piatto"></span>
                    </div>
                    <p class="card-text ingredienti-piatto"></p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="piatto-card-prezzo prezzo-piatto" style="font-weight: 700;"></span>
                    </div>
                    <div class="d-flex justify-content-between  mt-3 gap-2">
                        <button class="btn btn-outline-secondary rounded-pill btn-ricetta w-100"
                                data-bs-toggle="modal"
                                data-bs-target="#modalVisualizzaRicetta">
                            Ricetta
                        </button>
                        <button class="btn btn-outline-primary rounded-pill btn-modifica w-100"
                                data-bs-toggle="modal"
                                data-bs-target="#modalModifica">
                            Modifica
                        </button>
                        <button class="btn btn-outline-danger rounded-pill btn-rimuovi w-100">
                            Rimuovi
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- Aggiunta piatto -->
<div class="modal fade" id="modalAggiungiPiatto" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content" style="border-radius: 16px;">

            <div class="modal-header border-0">
                <h5 class="modal-title">Aggiungi piatto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <!-- Nav tabs -->
                <ul class="nav nav-pills mb-4" id="tabAggiungiPiatto">
                    <li class="nav-item">
                        <a class="nav-link active nav-link-menu" data-bs-toggle="pill" data-bs-target="#tabCatalogo"
                           type="button">Dal
                            catalogo</a>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link nav-link-menu" data-bs-toggle="pill" data-bs-target="#tabPersonalizzato"
                                type="button">Personalizzato
                        </button>
                    </li>
                </ul>

                <!-- Contenuto delle tab -->
                <div class="tab-content">
                    <!-- Tab Catalogo -->
                    <div class="tab-pane fade show active" id="tabCatalogo">
                        <label for="ricerca-catalogo" class="form-label">Cerca piatto nel catalogo</label>
                        <input name="ricerca-catalogo" type="text" id="ricerca-catalogo" class="form-control mb-3"
                               placeholder="Cerca nel catalogo...">

                        <!-- Lista piatti catalogo -->
                        <div id="body-catalogo" class="row g-4">
                            <div id="modello-catalogo" class="col-lg-4 col-md-6 d-none menu-item-card">
                                <div class="card border-0 shadow-sm">
                                    <img src="" class="card-img-top" alt="" style="height: 200px; object-fit: cover;">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                                            <h5 class="card-title mb-0"></h5>
                                            <span class="badge-categoria categoria-piatto"></span>
                                        </div>
                                        <p class="card-text ingredienti-piatto"></p>
                                        <button class="btn btn-brand rounded-pill px-4">Aggiungi</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tab Personalizzato -->
                    <div class="tab-pane fade show" id="tabPersonalizzato">
                        <div id="body-personalizzato" class="row g-4">
                            <form id="formAggiungiPiattoPersonalizzato" class="col-12" autocomplete="off">
                                <div class="mb-3">
                                    <label for="nomePiatto" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nomePiatto" required placeholder="Nome">
                                </div>
                                <div class="mb-3">
                                    <label for="categoriaPiatto" class="form-label">Categoria</label>
                                    <input type="text" class="form-control" id="categoriaPiatto"
                                           list="listaCategorie"
                                           required placeholder="Pizza, Pasta, Antipasto, Dessert...">
                                    <datalist class="listaCategorie" id="listaCategorie"></datalist>
                                </div>
                                <div class="mb-3">
                                    <label for="prezzoPiatto" class="form-label">Prezzo (€)</label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="prezzoPiatto"
                                           required placeholder="0.00">
                                </div>
                                <div class="mb-3">
                                    <label for="ingredientiPiatto" class="form-label">Ingredienti (separati da
                                        virgola)</label>
                                    <input type="text" class="form-control" id="ingredientiPiatto" required
                                           placeholder="Ingrediente1, Ingrediente2, ...">
                                </div>
                                <div class="mb-3">
                                    <label for="fotoPiatto" class="form-label">Foto</label>
                                    <input type="text" class="form-control" id="fotoPiatto" required
                                           placeholder="URL della foto">
                                </div>
                                <div class="mb-3">
                                    <label for="ricettaPiatto" class="form-label">Ricetta</label>
                                    <textarea class="form-control" id="ricettaPiatto" rows="3" required
                                              placeholder="Scrivi la ricetta del piatto..."></textarea>
                                </div>
                                <button type="submit"
                                        class="btn btn-brand rounded-pill w-100 py-2">Aggiungi al menu
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed top-0 start-50 translate-middle-x end-0 p-3" style="z-index: 1100;">
    <div id="toastSuccesso" class="toast align-items-center border-0" role="alert" aria-live="assertive"
         aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <span id="toastMessaggio">Piatto aggiunto con successo!</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Modal impostazione prezzo -->
<div class="modal fade" id="modalPrezzoCatalogo" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px;">
            <div class="modal-header border-0">
                <h5 class="modal-title">Imposta il prezzo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="fw-semibold mb-3" id="nomePiattoSelezionato"></p>
                <form id="formPrezzoCatalogo" class="mb-3">
                    <div class="mb-3">
                        <label for="prezzoCatalogo" class="form-label">Prezzo (€)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="prezzoCatalogo" required
                               placeholder="0.00">
                        <button type="submit" class="btn btn-brand rounded-pill w-100 py-2 mt-3">Imposta prezzo</button>
                    </div>
                </form>
                <p id="catalogo-conferma-messaggio" class="text-center mt-3 mb-0" style="font-size: 14px;"></p>
            </div>
        </div>
    </div>
</div>

<!-- Modal modifica piatto -->
<div class="modal fade" id="modalModifica" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px;">
            <div class="modal-header border-0">
                <h5 class="modal-title">Modifica Piatto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formModificaPiatto">
                    <div class="mb-3">
                        <label for="nomePiattoModifica" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nomePiattoModifica" required>
                    </div>
                    <div class="mb-3">
                        <label for="categoriaPiattoModifica" class="form-label">Categoria</label>
                        <input type="text" class="form-control" id="categoriaPiattoModifica"
                               list="listaCategorieModifica"
                               required>
                        <datalist class="listaCategorie" id="listaCategorieModifica"></datalist>
                    </div>
                    <div class="mb-3">
                        <label for="prezzoPiattoModifica" class="form-label">Prezzo (€)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="prezzoPiattoModifica"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="ingredientiPiattoModifica" class="form-label">Ingredienti (separati da
                            virgola)</label>
                        <input type="text" class="form-control" id="ingredientiPiattoModifica" required>
                    </div>
                    <div class="mb-3">
                        <label for="fotoPiattoModifica" class="form-label">Foto</label>
                        <input type="text" class="form-control" id="fotoPiattoModifica" required>
                    </div>
                    <div class="mb-3">
                        <label for="ricettaPiattoModifica" class="form-label">Ricetta</label>
                        <textarea class="form-control" id="ricettaPiattoModifica" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-brand rounded-pill w-100 py-2">Salva modifiche</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal visualizza ricetta -->
<div class="modal fade" id="modalVisualizzaRicetta" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px;">
            <div class="modal-header border-0">
                <h5 class="modal-title">Ricetta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="fw-semibold mb-3" id="nomePiattoRicetta"></p>
                <p id="testoRicetta" class="mb-0"></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="../../backend/lib.js"></script>

<script>

    checkLoggedRistoratore();
    caricaCategorieSuggerite();

    let catalogoCache = null;
    let piattoDaAggiungere = null;
    const user = JSON.parse(localStorage.getItem('utente'));

    function rimuoviDaMenu(menuId) {
        const options = {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                id: menuId,
            })
        }
        fetch(`http://localhost:3005/ristorante/${user._id}/menu`, options)
            .then(res => res.json())
            .then(result => {
                if (result.error) {
                    mostraToast("Errore durante la rimozione del piatto: " + result.error);
                } else {
                    mostraToast("Piatto rimosso con successo!");
                    caricaMenu();
                }
            });
    }

    async function caricaMenu() {
        const ristorante = JSON.parse(localStorage.getItem('ristorante'));
        const modello = document.getElementById('modello-menu');
        const body = document.getElementById('body');
        body.innerHTML = "";
        body.append(modello);
        const vuoto = document.getElementById('vuoto');
        const pieno = document.getElementById('pieno');

        try {
            fetch(`http://localhost:3005/ristorante/${ristorante._id}/menu?api_key=1234567`)
                .then(res => res.json())
                .then(piatti => {
                    if (!piatti || piatti.length === 0) {
                        pieno.style.display = 'none';
                        vuoto.style.display = 'block';
                        return;
                    }

                    vuoto.style.display = 'none';
                    pieno.style.display = 'block';
                    for (let i = 0; i < piatti.length; ++i) {
                        const clone = modello.cloneNode(true);
                        const piatto = piatti[i];
                        clone.getElementsByClassName('card-title')[0].innerText += piatto.nome;
                        clone.getElementsByClassName('ingredienti-piatto')[0].innerText += piatto.ingredienti.join(', ');
                        clone.getElementsByClassName('categoria-piatto')[0].innerText += piatto.categoria;
                        clone.getElementsByTagName('img')[0].alt = piatto.nome;
                        clone.getElementsByTagName('img')[0].src = piatto.foto;
                        clone.getElementsByClassName('prezzo-piatto')[0].innerText += piatto.prezzo.toFixed(2) + " €";


                        const btnRimuovi = clone.getElementsByClassName('btn-rimuovi')[0];
                        btnRimuovi.addEventListener('click', function () {
                            rimuoviDaMenu(piatto._id);
                        });

                        const btnModifica = clone.getElementsByClassName('btn-modifica')[0];
                        btnModifica.addEventListener('click', function () {
                            document.getElementById('nomePiattoModifica').value = piatto.nome;
                            document.getElementById('categoriaPiattoModifica').value = piatto.categoria;
                            document.getElementById('prezzoPiattoModifica').value = piatto.prezzo.toFixed(2);
                            document.getElementById('ingredientiPiattoModifica').value = piatto.ingredienti.join(', ');
                            document.getElementById('fotoPiattoModifica').value = piatto.foto;
                            document.getElementById('ricettaPiattoModifica').value = piatto.ricetta || "";
                            const form = document.getElementById('formModificaPiatto');

                            form.onsubmit = function (e) {
                                e.preventDefault();
                                const nome = document.getElementById('nomePiattoModifica').value;
                                const categoria = document.getElementById('categoriaPiattoModifica').value;
                                const prezzo = parseFloat(document.getElementById('prezzoPiattoModifica').value);
                                const ingredienti = document.getElementById('ingredientiPiattoModifica').value.split(',').map(i => i.trim());
                                const foto = document.getElementById('fotoPiattoModifica').value;
                                const options = {
                                    method: 'PUT',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({
                                        nome: nome,
                                        categoria: categoria,
                                        prezzo: prezzo,
                                        ingredienti: ingredienti,
                                        foto: foto,
                                        ricetta: document.getElementById('ricettaPiattoModifica').value
                                    })
                                };
                                fetch(`http://localhost:3005/ristorante/${user._id}/menu/${piatto._id}`, options)
                                    .then(res => res.json())
                                    .then(result => {
                                        if (result.error) {
                                            mostraToast("Errore durante la modifica del piatto: " + result.error);
                                        } else {
                                            mostraToast("Piatto modificato con successo!");
                                            const modaleModifica = bootstrap.Modal.getInstance(document.getElementById('modalModifica'));
                                            modaleModifica.hide();
                                            caricaMenu();
                                        }
                                    });
                            }
                        });
                        const btnRicetta = clone.getElementsByClassName('btn-ricetta')[0];
                        btnRicetta.addEventListener('click', function () {
                            document.getElementById('nomePiattoRicetta').textContent = piatto.nome;
                            document.getElementById('testoRicetta').textContent = piatto.ricetta || "Nessuna ricetta disponibile.";
                        });
                        clone.classList.remove('d-none');
                        clone.id = piatto._id;
                        modello.before(clone);
                    }
                })

        } catch (error) {
            console.error('Errore nel caricamento del menu:', error);
        }
    }


    async function caricaCatalogo() {
        const modello = document.getElementById('modello-catalogo');
        const body = document.getElementById('body-catalogo');
        if (!catalogoCache) {
            const res = await fetch(`http://localhost:3005/piatti?api_key=1234567`);
            catalogoCache = await res.json();
        }
        renderCatalogo(catalogoCache, modello, body);
    }

    function renderCatalogo(piatti, modello, body) {
        body.innerHTML = "";
        body.append(modello);

        for (let i = 0; i < piatti.length; ++i) {
            const clone = modello.cloneNode(true);
            const piatto = piatti[i];

            clone.getElementsByClassName('card-title')[0].innerText += piatto.strMeal;
            clone.getElementsByClassName('ingredienti-piatto')[0].innerText += piatto.ingredients.join(', ');
            clone.getElementsByClassName('categoria-piatto')[0].innerText += piatto.strCategory;
            clone.getElementsByTagName('img')[0].src = piatto.strMealThumb;

            clone.classList.remove('d-none');
            clone.id = piatto._id;
            const btn = clone.querySelector('button');
            btn.id = piatto._id;
            btn.addEventListener("click", () => {
                piattoDaAggiungere = {id: piatto._id, nome: piatto.strMeal, clone};

                document.getElementById('nomePiattoSelezionato').textContent = piatto.strMeal;
                document.getElementById('prezzoCatalogo').value = '';
                document.getElementById('catalogo-conferma-messaggio').textContent = '';

                const modalePrezzo = new bootstrap.Modal(document.getElementById('modalPrezzoCatalogo'));
                modalePrezzo.show();
            });
            modello.before(clone);
        }
    }

    caricaMenu();

    document.addEventListener("DOMContentLoaded", function () {
        const modal = document.getElementById("modalAggiungiPiatto");

        modal.addEventListener("shown.bs.modal", function () {
            caricaCatalogo();
        });
    });

    document.getElementById("formPrezzoCatalogo").addEventListener("submit", function (e) {
        e.preventDefault();

        const prezzo = document.getElementById("prezzoCatalogo").value;
        const messaggio = document.getElementById("catalogo-conferma-messaggio");

        if (!prezzo || parseFloat(prezzo) <= 0) {
            messaggio.textContent = "Inserisci un prezzo valido.";
            messaggio.style.color = "red";
            return;
        }


        const options = {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                idProdotto: piattoDaAggiungere.id,
                prezzo: parseFloat(prezzo)
            })
        };

        fetch(`http://localhost:3005/ristorante/${user._id}/menu/catalogo`, options)
            .then(res => res.json())
            .then(result => {
                if (result.error) {
                    messaggio.textContent = result.error;
                    messaggio.className = 'text-center mt-3 mb-0 text-danger';
                } else {
                    mostraToast("Piatto aggiunto con successo!");

                    const modalePrezzo = bootstrap.Modal.getInstance(document.getElementById('modalPrezzoCatalogo'));
                    modalePrezzo.hide();

                    caricaMenu();
                }
            });
    });

    document.getElementById("formAggiungiPiattoPersonalizzato").addEventListener("submit", function (e) {
        e.preventDefault();

        const nome = document.getElementById("nomePiatto").value;
        const categoria = document.getElementById("categoriaPiatto").value;
        const prezzo = parseFloat(document.getElementById("prezzoPiatto").value);
        const ingredienti = document.getElementById("ingredientiPiatto").value.split(",").map(i => i.trim());
        const foto = document.getElementById("fotoPiatto").value;
        const ricetta = document.getElementById("ricettaPiatto").value;

        const options = {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                nome: nome,
                categoria: categoria,
                prezzo: prezzo,
                ingredienti: ingredienti,
                foto: foto,
                ricetta: ricetta
            })
        };

        fetch(`http://localhost:3005/ristorante/${user._id}/menu/personalizzato`, options)
            .then(res => res.json())
            .then(result => {
                if (result.error) {
                    mostraToast("Errore durante l'aggiunta del piatto: " + result.error);
                } else {
                    mostraToast("Piatto aggiunto con successo!");
                    const modaleAggiungi = bootstrap.Modal.getInstance(document.getElementById('modalAggiungiPiatto'));
                    modaleAggiungi.hide();
                    caricaMenu();

                    document.getElementById("formAggiungiPiattoPersonalizzato").reset();
                }
            });
    });

    const inputRicerca = document.getElementById("ricerca-catalogo");

    inputRicerca.addEventListener("input", function () {
        const testo = inputRicerca.value.toLowerCase();

        const filtrati = catalogoCache.filter(p =>
            p.strMeal.toLowerCase().includes(testo) ||
            p.strCategory.toLowerCase().includes(testo) ||
            p.ingredients.join(" ").toLowerCase().includes(testo)
        );

        const modello = document.getElementById('modello-catalogo');
        const body = document.getElementById('body-catalogo');

        renderCatalogo(filtrati, modello, body);
    });

</script>
</body>
</html>

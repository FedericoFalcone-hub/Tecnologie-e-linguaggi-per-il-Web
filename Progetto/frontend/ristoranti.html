<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Ristoranti - Bizarre Bites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <style>
        .ristorante-card {
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .ristorante-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .12) !important;
        }
    </style>
</head>
<body>
<div id="navbar-container"></div>

<div class="container py-5">
    <h3 class="mb-4" style="font-weight: 700;">Ristoranti</h3>

    <form id="form-ricerca" class="d-flex gap-2 mb-2" style="max-width: 562px;">
        <label for="ricerca" class="visually-hidden">Cerca ristorante</label>
        <input type="search" id="ricerca" class="form-control rounded-pill px-4"
               placeholder="Cerca per nome, città, via..."
               autocomplete="off">
        <button type="submit" class="btn btn-brand rounded-pill px-4">Cerca</button>
    </form>
    <p id="conteggio" class="text-muted mb-4" style="font-size: 14px; min-height: 21px;"></p>

    <div class="text-center w-100" id="loader">
        <div class="spinner-border text-dark" role="status">
            <span class="visually-hidden">Caricamento...</span>
        </div>
    </div>

    <!-- Template ristorante -->
    <div id="modello-ristorante" class="col-lg-4 col-md-6 d-none">
        <a href="#" class="ristorante-link text-decoration-none text-dark d-block h-100">
            <div class="ristorante-card card border-0 shadow-sm h-100">
                <div class="card-body p-4 d-flex align-items-center gap-3">
                    <div class="ristorante-icona d-flex align-items-center justify-content-center flex-shrink-0"
                         style="width: 64px; height: 64px; border-radius: 16px; overflow: hidden; background: var(--brand); color: #fff; font-size: 22px; font-weight: 700;">
                        <img class="ristorante-logo d-none" alt=""
                             style="width: 100%; height: 100%; object-fit: cover;">
                        <span class="ristorante-iniziali"></span>
                    </div>
                    <div class="overflow-hidden">
                        <h5 class="ristorante-nome fw-bold mb-1 text-truncate"></h5>

                        <small class="ristorante-indirizzo text-muted d-flex align-items-center gap-2 mb-1"
                               style="line-height: 1;">
                            <img src="../backend/images/location.png" alt="" class="d-block flex-shrink-0"
                                 style="width: 14px; height: 14px; object-fit: contain;">
                            <span class="text-truncate"></span>
                        </small>

                        <small class="ristorante-telefono text-muted d-flex align-items-center gap-2"
                               style="line-height: 1;">
                            <img src="../backend/images/phone.png" alt="" class="d-block flex-shrink-0"
                                 style="width: 14px; height: 14px; object-fit: contain;">
                            <span class="text-truncate"></span>
                        </small>
                    </div>
                </div>
            </div>
        </a>
    </div>
    <div id="lista-ristoranti" class="row g-4"></div>
    <p id="nessun-ristorante" class="text-muted text-center py-5 d-none"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../backend/lib.js"></script>

<script>
    const input = document.getElementById('ricerca');
    let ristorantiCompleti = [];

    function formattaIndirizzo(r) {
        if (!r.via) return '';
        return `${r.via}, ${r.civico}, ${r.cap}, ${r.citta} (${r.provincia})`;
    }

    function renderRistoranti(ristoranti, q) {
        const lista = document.getElementById('lista-ristoranti');
        const modello = document.getElementById('modello-ristorante');
        lista.innerHTML = '';

        const vuoto = document.getElementById('nessun-ristorante');
        vuoto.textContent = q ? `Nessun ristorante trovato per "${q}".` : 'Nessun ristorante disponibile al momento.';
        vuoto.classList.toggle('d-none', ristoranti.length > 0);

        document.getElementById('conteggio').textContent = ristoranti.length > 0
            ? `${ristoranti.length} ${ristoranti.length === 1 ? 'ristorante' : 'ristoranti'}`
            : '';

        ristoranti.forEach(r => {
            const clone = modello.cloneNode(true);
            clone.id = r._id;
            clone.classList.remove('d-none');

            clone.querySelector('.ristorante-link').href = `ristorante.html?id=${r._id}`;
            clone.querySelector('.ristorante-nome').textContent = r.nomeRistorante;
            clone.querySelector('.ristorante-indirizzo span').textContent = formattaIndirizzo(r);
            clone.querySelector('.ristorante-telefono span').textContent = r.telefonoRistorante || '';
            clone.querySelector('.ristorante-indirizzo').classList.toggle('d-none', !r.via);
            clone.querySelector('.ristorante-telefono').classList.toggle('d-none', !r.telefonoRistorante);

            const icona = clone.querySelector('.ristorante-icona');
            const iniziali = clone.querySelector('.ristorante-iniziali');
            const logo = clone.querySelector('.ristorante-logo');
            iniziali.textContent = (r.nomeRistorante || '').substring(0, 2).toUpperCase();

            if (r.logoUrl) {
                logo.onload = () => {
                    icona.style.background = '#fff';
                    logo.classList.remove('d-none');
                    logo.style.background = 'transparent';
                    iniziali.classList.add('d-none');
                };
                logo.src = r.logoUrl;
            }

            lista.appendChild(clone);
        });
    }

    function filtra() {
        const q = input.value.trim();
        const queryLower = q.toLowerCase();

        history.replaceState(null, '', q ? `?q=${encodeURIComponent(q)}` : window.location.pathname);

        if (!q) {
            renderRistoranti(ristorantiCompleti, '');
            return;
        }

        const filtrate = ristorantiCompleti.filter(r => {
            const nome = (r.nomeRistorante || '').toLowerCase();
            const citta = (r.citta || '').toLowerCase();
            const via = (r.via || '').toLowerCase();

            return nome.includes(queryLower) || citta.includes(queryLower) || via.includes(queryLower);
        });

        renderRistoranti(filtrate, q);
    }

    async function caricaRistoranti() {
        try {
            const response = await fetch(`http://localhost:3005/ristoranti?api_key=${API_KEY}`);
            const risultato = await response.json();

            if (risultato.error) {
                console.error(risultato.error);
                return;
            }

            document.getElementById('loader').style.display = 'none';
            ristorantiCompleti = risultato;

            input.value = new URLSearchParams(window.location.search).get('q') || '';
            filtra();
        } catch (error) {
            console.error('Errore:', error);
            document.getElementById('loader').style.display = 'none';
        }
    }

    document.getElementById('form-ricerca').addEventListener('submit', (e) => {
        e.preventDefault();
        filtra();
    });

    caricaRistoranti();
</script>
</body>
</html>

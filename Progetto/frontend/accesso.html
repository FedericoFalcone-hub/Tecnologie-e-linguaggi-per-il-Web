<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

<div id="navbar-container"></div>


<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">

                <div class="card auth-card border-0 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="text-dark" style="font-size: 26px; font-weight: 700;">Bentornato</h2>
                        <p class="text-muted mb-0" style="font-size: 14px;">Accedi per continuare</p>
                    </div>

                    <form id="form-accesso">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">✉️</span>
                                <input type="email" class="form-control border-start-0" id="email"
                                       placeholder="nome@esempio.it">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0">🔒</span>
                                <input type="password" class="form-control border-start-0" id="password"
                                       placeholder="••••••••">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-brand rounded-pill w-100 py-2">Accedi</button>
                        <p id="accesso-messaggio" class="text-center mt-3 mb-0" style="font-size: 14px;"></p>

                        <p class="text-center text-muted mt-4 mb-0" style="font-size: 14px;">
                            Non hai un account? <a href="registrazione.html"
                                                   class="text-brand fw-semibold text-decoration-none">Registrati</a>
                        </p>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="../backend/lib.js"></script>

<script>
    checkLogged();

    function login(result) {
        let alert = document.getElementById('accesso-messaggio');
        if (result.error) {
            alert.innerHTML = result.error;
            alert.classList.add('text-danger');
        } else {
            localStorage.setItem('utente', JSON.stringify(result));
            if (result.ristoratore) {
                window.location.href = "ristorante/gestione_ristorante.html";
            } else {
                window.location.href = "bizarre_bites.html";
            }
        }
    }

    document.getElementById('form-accesso').addEventListener('submit', function (e) {
        e.preventDefault();
        const cEmail = document.getElementById('email').value;
        const cPassword = document.getElementById('password').value;

        const user = {
            email: cEmail,
            password: cPassword
        };

        const options = {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(user)
        };

        fetch("http://localhost:3005/user/login?api_key=1234567", options)
            .then(response => response.json())
            .then(result => login(result));
    });


</script>
</body>

</html>

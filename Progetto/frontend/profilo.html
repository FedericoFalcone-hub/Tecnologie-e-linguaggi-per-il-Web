<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>
<div id="navbar-container"></div>

<div class="profile-header">
    <div class="container">
        <div class="d-flex align-items-center gap-4 py-4">
            <div class="profile-avatar" id="avatar-iniziali"></div>
            <div>
                <h3 class="mb-1" id="profilo-nome-header"></h3>
                <p class="text-muted mb-0" id="profilo-email-header" style="font-size: 14px;"></p>
            </div>
        </div>
    </div>
</div>

<div class="container py-5">
    <div class="row">
        <div class="col-lg-3 mb-4">
            <div class="list-group profile-sidebar">
                <a href="#sezione-dati" class="list-group-item list-group-item-action active" data-tab="dati">Dati
                    personali</a>
                <a href="#sezione-indirizzi" class="list-group-item list-group-item-action" data-tab="indirizzi">Indirizzi</a>
                <a href="#sezione-sicurezza" class="list-group-item list-group-item-action"
                   data-tab="sicurezza">Modifica password</a>
                <a href="#" class="list-group-item list-group-item-action">I miei ordini</a>
                <a href="#" class="list-group-item list-group-item-action text-danger"
                   onclick="eliminaAccount()">Elimina account</a>

            </div>
        </div>

        <div class="col-lg-9">

            <!-- Dati personali -->
            <div id="sezione-dati" class="profile-section">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="mb-4">Dati personali</h5>
                    <form id="form-dati">
                        <div class="row">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome" name="nome" minlength="2"
                                           required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cognome" class="form-label">Cognome</label>
                                    <input type="text" class="form-control" id="cognome" name="cognome"
                                           minlength="2" required>
                                </div>
                                <div class="mb-4">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                                <button type="submit" class="btn btn-brand rounded-pill px-4 py-2">Salva
                                    modifiche
                                </button>
                                <p id="dati-messaggio" class="mt-3 mb-0" style="font-size: 14px;"></p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Indirizzi -->
            <div id="sezione-indirizzi" class="profile-section" style="display: none;">
                <div class="card border-0 shadow-sm p-4 mb-4">
                    <h5 class="mb-4">I miei indirizzi</h5>

                    <!-- template fuori dalla lista che viene svuotata -->
                    <div id="modello-indirizzo" class="d-none d-flex align-items-center gap-3 mb-3 pb-3 border-bottom">
                        <img src="../backend/images/location.png" alt=""
                             style="width: 28px; height: 28px; object-fit: contain;">
                        <div class="flex-grow-1">
                            <span class="indirizzo-titolo fw-semibold"></span>
                            <span class="indirizzo-predefinito badge text-bg-light border ms-1 d-none">Predefinito</span>
                            <small class="indirizzo-dettaglio text-muted d-block"></small>
                        </div>
                        <button class="btn btn-sm btn-outline-danger btn-elimina-indirizzo"
                                aria-label="Elimina indirizzo">
                            <img src="../backend/images/bin.png" alt=""
                                 style="width: 16px; height: 16px; object-fit: contain;">
                        </button>
                    </div>

                    <div id="lista-indirizzi"></div>
                    <p id="lista-messaggio" class="mt-2 mb-0" style="font-size: 14px;"></p>
                </div>

                <div class="card border-0 shadow-sm p-4">
                    <h5 class="mb-4">Aggiungi un indirizzo</h5>
                    <form id="form-nuovo-indirizzo">
                        <div class="row g-3 mb-3">
                            <div class="col-8">
                                <label for="ind-via" class="form-label">Via</label>
                                <input type="text" class="form-control" id="ind-via" maxlength="100" required>
                            </div>
                            <div class="col-4">
                                <label for="ind-civico" class="form-label">Civico</label>
                                <input type="text" class="form-control" id="ind-civico" maxlength="10" required>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="ind-citta" class="form-label">Città</label>
                                <input type="text" class="form-control" id="ind-citta" maxlength="60" required>
                            </div>
                            <div class="col-6 col-md-3">
                                <label for="ind-cap" class="form-label">CAP</label>
                                <input type="text" class="form-control" id="ind-cap" inputmode="numeric"
                                       maxlength="5" pattern="\d{5}" required>
                            </div>
                            <div class="col-6 col-md-3">
                                <label for="ind-provincia" class="form-label">Provincia</label>
                                <input type="text" class="form-control text-uppercase" id="ind-provincia"
                                       maxlength="2" pattern="[A-Za-z]{2}" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-brand rounded-pill px-4 py-2">Aggiungi indirizzo</button>
                        <p id="indirizzo-messaggio" class="mt-3 mb-0" style="font-size: 14px;"></p>
                    </form>
                </div>
            </div>

            <!-- Modifica password -->
            <div id="sezione-sicurezza" class="profile-section" style="display: none;">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="mb-4">Modifica password</h5>
                    <form id="form-sicurezza">
                        <div class="mb-4">
                            <label for="password-attuale" class="form-label">Password attuale</label>
                            <input type="password" class="form-control" id="password-attuale"
                                   name="password-attuale" minlength="6" placeholder="••••••••" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Nuova password</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="6"
                                   placeholder="••••••••" required>
                        </div>
                        <div class="mb-4">
                            <label for="password-conferma" class="form-label">Conferma nuova password</label>
                            <input type="password" class="form-control" id="password-conferma"
                                   name="password-conferma" minlength="6" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-brand rounded-pill px-4 py-2">Aggiorna
                            password
                        </button>
                        <p id="sicurezza-messaggio" class="mt-3 mb-0" style="font-size: 14px;"></p>

                    </form>


                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="../backend/lib.js"></script>

<script>
    const utente = JSON.parse(localStorage.getItem('utente'));

    if (!isLogged()) {
        window.location.href = "bizarre_bites.html";
    }

    function aggiornaHeader() {
        document.getElementById('profilo-nome-header').textContent = utente.nome + ' ' + utente.cognome;
        document.getElementById('profilo-email-header').textContent = utente.email;
        document.getElementById('avatar-iniziali').textContent = utente.nome.charAt(0).toUpperCase() + utente.cognome.charAt(0).toUpperCase();
    }

    function aggiornaDati(result) {
        if (result.error) {
            document.getElementById('dati-messaggio').textContent = result.error;
            document.getElementById('dati-messaggio').classList.add('text-danger');
        } else {
            const utenteAggiornato = {
                ...JSON.parse(localStorage.getItem('utente')),
                nome: document.getElementById('nome').value,
                cognome: document.getElementById('cognome').value,
                email: document.getElementById('email').value
            };
            localStorage.setItem('utente', JSON.stringify(utenteAggiornato));
            document.getElementById('dati-messaggio').textContent = 'Dati aggiornati con successo!';
            document.getElementById('dati-messaggio').classList.remove('text-danger');
            document.getElementById('dati-messaggio').classList.add('text-success');
            aggiornaHeader();
        }
    }

    function aggiornaPassword(result) {
        if (result.error) {
            document.getElementById('password-attuale').classList.remove('text-success');
            document.getElementById('sicurezza-messaggio').textContent = result.error;
            document.getElementById('sicurezza-messaggio').classList.add('text-danger');
        } else {
            document.getElementById('sicurezza-messaggio').textContent = 'Password aggiornata con successo!';
            document.getElementById('sicurezza-messaggio').classList.remove('text-danger');
            document.getElementById('sicurezza-messaggio').classList.add('text-success');
        }
    }

    function eliminaAccount() {
        if (confirm("Sei sicuro di voler eliminare il tuo account? Questa azione è irreversibile.")) {
            const utente = JSON.parse(localStorage.getItem('utente'));
            const options = {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            };

            fetch(`http://localhost:3005/user/${utente._id}?api_key=1234567`, options)
                .then(response => response.json())
                .then(result => {
                    if (result.error) {
                        alert("Errore durante l'eliminazione dell'account: " + result.error);
                    } else {
                        localStorage.removeItem('utente');
                        window.location.href = "bizarre_bites.html";
                    }
                });
        }
    }

    aggiornaHeader();

    document.querySelectorAll('.profile-sidebar [data-tab]').forEach(link => {
        link.addEventListener('click', function (e) {
            e.preventDefault();

            document.querySelectorAll('.profile-sidebar [data-tab]').forEach(l => l.classList.remove('active'));
            this.classList.add('active');

            document.querySelectorAll('.profile-section').forEach(sezione => sezione.style.display = 'none');
            document.getElementById(this.getAttribute('href').substring(1)).style.display = 'block';
        });
    });

    document.getElementById('nome').value = utente.nome;
    document.getElementById('cognome').value = utente.cognome;
    document.getElementById('email').value = utente.email;

    //Modifica dati personali
    document.getElementById('form-dati').addEventListener('submit', function (e) {
        e.preventDefault();
        const cNome = capitalize(document.getElementById('nome').value);
        const cCognome = capitalize(document.getElementById('cognome').value);
        const cEmail = document.getElementById('email').value.toLowerCase();

        const user = {
            nome: cNome,
            cognome: cCognome,
            email: cEmail,
        };

        const options = {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(user)
        };

        fetch(`http://localhost:3005/user/${utente._id}?api_key=1234567`, options)
            .then(response => response.json())
            .then(result => aggiornaDati(result))
    });


    //Modifica password
    document.getElementById('form-sicurezza').addEventListener('submit', function (e) {
        e.preventDefault();


        const password = document.getElementById('password').value;
        const passwordConferma = document.getElementById('password-conferma').value;
        const password_attuale = document.getElementById('password-attuale').value;

        if (password !== passwordConferma) {
            document.getElementById('sicurezza-messaggio').classList.remove('text-success');
            document.getElementById('sicurezza-messaggio').textContent = 'Le password non corrispondono';
            document.getElementById('sicurezza-messaggio').classList.add('text-danger');
            return;
        }
        const user = {
            passwordAttuale: password_attuale,
            password: password
        }

        const options = {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(user)
        };


        fetch(`http://localhost:3005/user/${utente._id}/password?api_key=1234567`, options)
            .then(response => response.json())
            .then(result => aggiornaPassword(result))
    });

    function renderIndirizzi() {
        const lista = document.getElementById('lista-indirizzi');
        const modello = document.getElementById('modello-indirizzo');
        const indirizzi = JSON.parse(localStorage.getItem('utente')).indirizzi;
        lista.innerHTML = '';

        indirizzi.forEach(ind => {
            const clone = modello.cloneNode(true);
            clone.removeAttribute('id');
            clone.classList.remove('d-none');

            const stradale = `${ind.via}, ${ind.civico}`;
            const localita = [ind.cap, ind.citta].filter(Boolean).join(', ');
            console.log(ind);
            const provincia = ind.provincia ? ` (${ind.provincia})` : '';

            clone.querySelector('.indirizzo-titolo').textContent = stradale;
            clone.querySelector('.indirizzo-dettaglio').textContent = `${stradale}, ${localita}${provincia}`;
            clone.querySelector('.indirizzo-predefinito').classList.toggle('d-none', !ind.predefinito);

            const btn = clone.querySelector('.btn-elimina-indirizzo');
            btn.disabled = indirizzi.length === 1;
            btn.title = indirizzi.length === 1 ? 'Deve rimanere almeno un indirizzo' : '';
            btn.addEventListener('click', () => eliminaIndirizzo(ind._id));

            lista.appendChild(clone);
        })
    }

    async function eliminaIndirizzo(idIndirizzo) {
        if (!confirm('Vuoi eliminare questo indirizzo?')) return;

        try {
            await fetch(`http://localhost:3005/user/${utente._id}/indirizzi/${idIndirizzo}?api_key=1234567`, {method: 'DELETE'});

            const eliminato = utente.indirizzi.find(a => a._id === idIndirizzo);
            utente.indirizzi = utente.indirizzi.filter(a => a._id !== idIndirizzo);
            if (eliminato.predefinito && utente.indirizzi.length > 0) {
                utente.indirizzi[0].predefinito = true;
            }
            salvaUtente();
            renderIndirizzi();
            document.getElementById('lista-messaggio').textContent = '';
        } catch (error) {
            const el = document.getElementById('lista-messaggio');
            el.textContent = error.message;
            el.className = 'mt-2 mb-0 text-danger';
        }
    }

    document.getElementById('form-nuovo-indirizzo').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.submitter;
        btn.disabled = true;

        const body = {
            via: capitalize(document.getElementById('ind-via').value.trim()),
            civico: document.getElementById('ind-civico').value.trim(),
            citta: capitalize(document.getElementById('ind-citta').value.trim()),
            cap: document.getElementById('ind-cap').value.trim(),
            provincia: document.getElementById('ind-provincia').value.trim().toUpperCase()
        };


        try {
            const response = await fetch(`http://localhost:3005/user/${utente._id}/indirizzi?api_key=1234567`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const risultato = await response.json();

            if (risultato.predefinito) {
                (utente.indirizzi || []).forEach(a => a.predefinito = false);
            }
            utente.indirizzi = [...(utente.indirizzi || []), risultato];
            salvaUtente();
            renderIndirizzi();

            e.target.reset();
            mostraMessaggio('indirizzo-messaggio', 'Indirizzo aggiunto!');
        } catch (error) {
            mostraMessaggio('indirizzo-messaggio', error.message, true);
        } finally {
            btn.disabled = false;
        }
    });

    function salvaUtente() {
        localStorage.setItem('utente', JSON.stringify(utente));
    }

    function mostraMessaggio(idElemento, testo, errore = false) {
        const el = document.getElementById(idElemento);
        el.textContent = testo;
        el.className = `mt-3 mb-0 ${errore ? 'text-danger' : 'text-success'}`;
    }

    renderIndirizzi();
</script>

</body>

</html>
